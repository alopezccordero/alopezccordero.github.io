<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alejandro Lopez Cordero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* Executive: a bio page in the manner of a firm or faculty profile. Navy is the only color;
   section titles sit in a left column, content on the right, separated by hairlines. */
:root { --navy:#13284b; --ink:#1c2430; --mut:#5f6873; --line:#dde2e8; --soft:#f5f7fa; }
* { box-sizing:border-box; }
body { margin:0; background:#fff; color:var(--ink); font:17px/1.65 "Source Sans 3", system-ui, sans-serif; border-top:4px solid var(--navy); }
h1, h2, h3, .serif { font-family:"Source Serif 4", Georgia, serif; font-weight:600; color:var(--navy); }
a { color:var(--navy); text-underline-offset:3px; text-decoration-thickness:1px; }
a:hover { text-decoration-thickness:2px; }
a:focus-visible { outline:2px solid var(--navy); outline-offset:3px; }
.wrap { max-width:1120px; margin:0 auto; padding:0 28px; }
header.top .wrap { display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap; padding-top:22px; padding-bottom:22px; border-bottom:1px solid var(--line); }
header.top .nm { font:600 19px "Source Serif 4", serif; color:var(--navy); text-decoration:none; }
header.top nav { display:flex; gap:26px; flex-wrap:wrap; font-size:15.5px; } header.top nav a { color:var(--ink); text-decoration:none; } header.top nav a:hover { color:var(--navy); text-decoration:underline; }
/* Hero: name and summary on the left, a plain rectangular portrait with caption on the right. */
.hero { display:grid; grid-template-columns:1fr 300px; gap:64px; padding:64px 0 56px; align-items:start; }
.hero .pre { color:var(--mut); margin:0 0 14px; font-size:16px; }
.hero h1 { font-size:clamp(44px, 5.6vw, 68px); line-height:1.04; letter-spacing:-.015em; margin:0 0 24px; }
.hero .sum { font-size:21px; line-height:1.5; margin:0 0 14px; max-width:40ch; }
.hero .focus { color:var(--mut); margin:0 0 30px; max-width:52ch; }
.btn { display:inline-block; padding:11px 22px; background:var(--navy); color:#fff; text-decoration:none; font-weight:600; margin:0 10px 10px 0; border:1.5px solid var(--navy); }
.btn:hover { background:#0c1c37; }
.btn.o { background:#fff; color:var(--navy); }
.btn.o:hover { background:var(--soft); }
figure { margin:0; }
figure img { display:block; width:100%; aspect-ratio:3/4; object-fit:cover; object-position:50% 20%; }
figcaption { font-size:14.5px; color:var(--mut); margin-top:10px; line-height:1.5; }
figcaption b { display:block; color:var(--ink); font-weight:600; }
/* At a glance: four plain figures between hairlines. */
.glance { display:grid; grid-template-columns:repeat(4, 1fr); border-top:1px solid var(--navy); border-bottom:1px solid var(--line); }
.glance div { padding:18px 20px 16px 0; }
.glance b { display:block; font:600 28px "Source Serif 4", serif; color:var(--navy); line-height:1.1; }
.glance span { color:var(--mut); font-size:14.5px; }
/* Sections: title column + content column. */
section { display:grid; grid-template-columns:260px 1fr; gap:48px; padding:56px 0; border-bottom:1px solid var(--line); }
section > h2 { font-size:26px; margin:0; line-height:1.2; }
section > h2 small { display:block; font:400 15px "Source Sans 3", sans-serif; color:var(--mut); margin-top:8px; line-height:1.5; }
.body p { margin:0 0 14px; max-width:68ch; }
.plain { color:var(--mut); font-size:15.5px; }
.proj { padding:0 0 28px; margin:0 0 28px; border-bottom:1px solid var(--line); }
.proj:last-child { border-bottom:0; margin-bottom:0; padding-bottom:0; }
.proj h3 { font-size:22px; line-height:1.3; margin:0 0 4px; }
.proj .meta { color:var(--mut); font-size:15px; margin:0 0 10px; }
.proj ul { margin:10px 0 12px; padding:0; list-style:none; }
.proj li { padding-left:18px; position:relative; margin:4px 0; }
.proj li::before { content:"–"; position:absolute; left:0; color:var(--navy); }
.proj .lk { display:flex; gap:20px; flex-wrap:wrap; font-weight:600; font-size:15.5px; margin-top:8px; }
.rows .r { display:grid; grid-template-columns:120px 1fr; gap:20px; padding:0 0 22px; }
.rows .d { color:var(--mut); font-size:15px; padding-top:3px; }
.rows h3 { font-size:19px; margin:0; }
.rows p { margin:2px 0 0; }
.rows .o { color:var(--mut); }
.lists { display:grid; grid-template-columns:1fr 1fr; gap:28px 40px; }
.lists h3 { font-size:18px; margin:0 0 10px; }
.lists ul { margin:0; padding-left:18px; } .lists li { margin-bottom:7px; }
.mail { font:600 clamp(22px, 3vw, 30px) "Source Serif 4", serif; }
.cl { display:flex; gap:20px; flex-wrap:wrap; margin-top:14px; font-weight:600; }
footer { color:var(--mut); font-size:14.5px; padding:26px 0 80px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
/* View switcher (Night vision / Executive / Terminal). */
.themes { position:fixed; right:18px; bottom:18px; z-index:10; display:flex; background:#fff; border:1px solid var(--line); box-shadow:0 6px 20px rgba(19,40,75,.12); }
.themes a { padding:8px 14px; font-size:14px; font-weight:600; color:var(--ink); text-decoration:none; border-left:1px solid var(--line); }
.themes a:first-child { border-left:0; }
.themes a:hover { background:var(--soft); }
.themes a[aria-current] { background:var(--navy); color:#fff; }
@media (max-width:860px){ .hero { grid-template-columns:1fr; gap:30px; } figure { max-width:280px; order:-1; } .glance { grid-template-columns:1fr 1fr; }
  section { grid-template-columns:1fr; gap:18px; } .rows .r { grid-template-columns:1fr; gap:2px; } .lists { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header class="top"><div class="wrap" id="top"></div></header>
<main class="wrap" id="app"></main>
<nav class="themes" aria-label="Switch view"><a href="index.html" aria-current="page">Executive</a><a href="night-vision.html">Night vision</a><a href="terminal.html">Terminal</a></nav>
<script src="data.js"></script>
<script>
const P = window.PORTFOLIO, ROOT = ''; // folder holding the photo, relative to this page
const links = p => p.link ? [].concat(p.link).map((url, i) => [/^(https?:|mailto:)/.test(url) ? url : 'https://' + url, [].concat(p.linkLabel)[i] || url]) : [];
const ext = (url, text, cls = '') => `<a${cls ? ` class="${cls}"` : ''} href="${url}" target="_blank" rel="noreferrer">${text}</a>`;
const edu = P.education[0];

document.getElementById('top').innerHTML = `<a class="nm" href="#">${P.name}</a>
  <nav aria-label="Main"><a href="#about">About</a><a href="#projects">Projects</a><a href="#experience">Experience</a><a href="#education">Education</a><a href="#contact">Contact</a></nav>`;

document.getElementById('app').innerHTML = `
<div class="hero">
  <div><p class="pre">${edu.title}, ${edu.org}, ${edu.note.toLowerCase()} ${edu.when}</p>
    <h1>${P.name}</h1><p class="sum">${P.summary}</p><p class="focus">${P.focus}</p>
    <a class="btn" href="#projects">View projects</a>${ext(P.links.resume, 'Résumé (PDF)', 'btn o')}</div>
  ${P.photo ? `<figure><img src="${ROOT}${P.photo}" alt="Portrait of ${P.name}"><figcaption><b>${P.location}</b>${P.status}.</figcaption></figure>` : ''}
</div>
<div class="glance">${P.stats.map(s => `<div><b>${s.value}</b><span>${s.label}</span></div>`).join('')}</div>

<section id="about"><h2>About</h2><div class="body">${P.about.map(a => `<p>${a}</p>`).join('')}
  <p class="plain">Areas of interest: ${P.interests.join(', ').toLowerCase().replace(/\bai\b/g, 'AI')}.</p>
  <p class="plain">Working with: ${P.focusTags.join(', ')}.</p></div></section>

<section id="projects"><h2>Projects<small>${P.projects.length} projects in reinforcement learning, computer vision and software engineering.</small></h2><div>
${P.projects.map(p => `<article class="proj"><h3>${p.title}</h3><p class="meta">${p.year}, ${p.area.toLowerCase().replace(/\brl\b/g, 'RL')}</p><p>${p.desc}</p>
  ${p.metrics.length ? `<ul>${p.metrics.map(m => `<li>${m}</li>`).join('')}</ul>` : ''}
  <p class="plain" style="margin:0">Built with ${p.tags.join(', ')}.</p>
  ${links(p).length ? `<div class="lk">${links(p).map(([u, l]) => ext(u, l)).join('')}</div>` : ''}</article>`).join('')}</div></section>

<section id="experience"><h2>Experience</h2><div class="rows">
  ${P.experience.map(e => `<div class="r"><span class="d">${e.when}</span><div><h3>${e.title}</h3><p class="o">${e.org}</p><p>${e.desc}</p></div></div>`).join('')}</div></section>

<section id="education"><h2>Education</h2><div class="rows">
  ${P.education.map(e => `<div class="r"><span class="d">${e.when}</span><div><h3>${e.title}</h3><p class="o">${e.org}${e.note === 'Expected' ? ', expected' : `, ${e.note}`}</p></div></div>`).join('')}</div></section>

<section id="recognition"><h2>Recognition &amp; skills</h2><div class="lists">
  <div><h3>Awards</h3><ul>${P.awards.map(a => `<li>${a}</li>`).join('')}</ul></div>
  <div><h3>Organizations</h3><ul>${(P.organizations || []).map(o => `<li>${o}</li>`).join('')}</ul></div>
  <div><h3>Certificates</h3><ul>${P.certificates.map(c => `<li>${ext(c.link, c.title)}, ${c.issuer}</li>`).join('')}</ul></div>
  <div><h3>Skills</h3><ul>${Object.entries(P.skills).map(([k, v]) => `<li>${k}: ${v.join(', ')}</li>`).join('')}<li>Languages: ${P.spoken.join(', ')}</li></ul></div></div></section>

<section id="contact" style="border-bottom:0"><h2>Contact</h2><div><a class="mail" href="mailto:${P.email}">${P.email}</a>
  <div class="cl">${P.profiles.map(l => ext(l.url, l.label)).join('')}</div></div></section>
<footer><span>© ${new Date().getFullYear()} ${P.name}</span><span>${P.location}</span></footer>`;
</script>
</body>
</html>
